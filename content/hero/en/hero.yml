pause_question: What brought you here today?
pause_cue: If you like, take one slow breath. Let your shoulders drop.
eyebrow: Circles of Light
headline: Bring your light. In the circle, we kindle it together.
subline_1: Find the Light and feel the peace within
subline_2: and let it flow to others and the world around you.
intro: In the Circle of Light, there is nothing to do and nothing to fix. Simply rest, feel at ease, and open to the healing energy. Circles can be held in person or online, so you can join wherever you are.
